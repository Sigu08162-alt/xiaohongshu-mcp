fingerprint:
  anchors: []
  metrics:
    - visible_count
    - button_count
    - input_count
    - container_count
  thresholds:
    min_anchor_changes: 1
    min_metric_changes: 1
    metric_change_ratio: 0.1
click_plan:
  targets:
    - item_selector
    - text
  precheck:
    require_visible: true
    require_clickable: true
verify:
  timeout_seconds: 10
fallbacks:
  retry:
    max_attempts: 2
outputs:
  trace_path: semantic_trace.yaml
  failure_path: semantic_failures.yaml
