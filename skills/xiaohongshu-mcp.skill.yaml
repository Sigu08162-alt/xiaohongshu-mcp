instructions: |
  # 小红书 MCP 工具集技能

  这个技能提供完整的小红书平台操作能力，包括：

  ## 核心功能

  ### 1. 内容发布
  - **发布图文笔记**: 支持14项配置功能，包括标题、正文、图片、标签、地点、合集、群聊、标记、原创声明等
  - **发布视频笔记**: 上传视频并发布，支持标题、正文、标签、定时发布

  ### 2. 内容发现
  - **搜索笔记**: 支持关键词搜索，可按排序、类型、时间、范围、位置等多维度筛选
  - **获取Feed列表**: 获取首页推荐流和用户笔记列表
  - **获取笔记详情**: 获取完整笔记信息和评论列表

  ### 3. 内容互动
  - **评论**: 发表评论和回复评论
  - **点赞/收藏**: 点赞笔记、收藏笔记、点赞评论
  - **关注/取关**: 关注和取消关注用户

  ### 4. 内容管理
  - **删除**: 删除笔记和评论

  ### 5. 数据分析
  - **统计数据**: 获取粉丝数、获赞数、曝光数等
  - **粉丝分析**: 粉丝画像、增长趋势
  - **内容分析**: 笔记表现、互动率

  ## 使用指南

  ### 发布图文笔记示例

  当用户说："帮我发一条小红书笔记，标题是XX，内容是XX"时：

  1. 确认必填信息：
     - 标题（1-20字符）
     - 正文内容（1-1000字符）
     - 图片路径（至少1张）

  2. 询问可选配置：
     - 是否需要添加标签？
     - 是否需要添加地点？
     - 是否需要标记地点或用户？
     - 是否声明原创？
     - 可见范围设置？
     - 是否定时发布？

  3. 调用发布API，返回结果

  ### 搜索笔记示例

  当用户说："搜索深圳美食相关的笔记"时：

  1. 提取搜索关键词："深圳美食"
  2. 询问筛选条件：
     - 排序方式（综合/最新/最多点赞等）
     - 笔记类型（图文/视频/不限）
     - 发布时间（一天内/一周内/半年内）
  3. 调用搜索API
  4. 展示搜索结果

  ### 点赞/收藏示例

  当用户说："给这条笔记点赞"时：

  1. 确认笔记ID和xsec_token
  2. 调用点赞API
  3. 返回操作结果

  ### 数据分析示例

  当用户说："查看我的数据"或"粉丝分析"时：

  1. 调用统计数据API获取基础数据
  2. 调用粉丝分析API获取粉丝画像
  3. 调用内容分析API获取笔记表现
  4. 生成分析报告

  ## 重要提醒

  1. **xsec_token**: 大部分操作需要xsec_token，可从搜索、Feed列表、详情等接口获取
  2. **频率限制**:
     - 发布笔记：每小时≤3条
     - 点赞/收藏：每分钟≤10次
     - 评论：每分钟≤5条
     - 关注：每小时≤20个
  3. **内容合规**: 确保发布内容符合平台规范
  4. **图片路径**: 图片必须是有效的本地文件路径
  5. **定时发布**: 时间必须是未来时间

  ## 数据格式说明

  - **时间戳**: Unix timestamp (毫秒)
  - **定时时间**: ISO 8601格式 (如: 2026-01-27T10:30:00+08:00)
  - **数字缩写**: 1.2w=12000, 5000+=超过5000, 10w+=超过100000

  ## API文档参考

  详细的API参数和示例请参考：
  - 发布图文: /docs/api/00-publish-image.md
  - 发布视频: /docs/api/01-publish-video.md
  - 搜索: /docs/api/02-search.md
  - 评论: /docs/api/03-comment.md
  - 点赞收藏: /docs/api/04-like-favorite.md
  - 笔记详情: /docs/api/05-feed-detail.md
  - 关注: /docs/api/06-follow.md
  - Feed列表: /docs/api/07-feeds.md
  - 删除: /docs/api/08-delete.md
  - 用户资料: /docs/api/09-user-profile.md
  - 数据分析: /docs/api/10-data-analytics.md

  ## 工作流程

  1. **理解用户意图**: 识别用户想要执行的操作
  2. **收集必要信息**: 确认所有必填参数
  3. **询问可选配置**: 提供可选功能选项
  4. **调用对应API**: 使用正确的参数调用
  5. **处理响应结果**:
     - 成功: 告知用户操作成功，提供详情
     - 失败: 说明失败原因，给出解决建议
  6. **后续操作**: 根据需要提供相关操作建议

  ## 示例对话

  **用户**: 帮我发一条关于深圳美食的笔记

  **助手**: 好的，我来帮你发布小红书笔记。请提供以下信息：

  1. **标题**（必填，1-20字符）：比如"深圳美食探店"
  2. **正文内容**（必填，1-1000字符）：详细描述
  3. **图片**（必填，1-18张）：请提供图片文件路径

  另外，还有一些可选配置：
  - 要添加话题标签吗？（如#深圳美食 #探店）
  - 需要标记地点吗？（如"深圳湾公园"）
  - 是否声明原创？
  - 可见范围设置？（公开/仅自己/仅好友）
  - 是否需要定时发布？

  **用户**: 标题"深圳美食推荐"，内容"今天去了XX餐厅，味道不错"，图片在/path/to/food.jpg，加上标签"深圳美食"和"美食推荐"，声明原创，公开发布

  **助手**: 好的，我为你整理的笔记信息如下：
  - 标题：深圳美食推荐
  - 内容：今天去了XX餐厅，味道不错
  - 图片：/path/to/food.jpg
  - 标签：#深圳美食 #美食推荐
  - 原创声明：是
  - 可见范围：公开可见

  确认无误后，我将立即发布。[调用publish-image API]

  发布成功！笔记链接：https://www.xiaohongshu.com/explore/xxxxx

  ## 错误处理

  遇到错误时：
  1. 识别错误代码
  2. 提供清晰的错误解释
  3. 给出解决建议
  4. 必要时提供重试选项

  常见错误：
  - NOT_LOGGED_IN: 需要先登录
  - INVALID_XSEC_TOKEN: 令牌过期，需要重新获取
  - RATE_LIMIT_EXCEEDED: 操作过于频繁，请稍后再试
  - CONTENT_INVALID: 内容违规，请修改后重试

examples:
  - trigger: 发布小红书笔记
    response: |
      我可以帮你发布小红书笔记！请告诉我：

      1. **标题**（1-20字）
      2. **正文内容**（1-1000字）
      3. **图片路径**（至少1张图片的本地路径）

      可选配置：
      - 话题标签（最多10个）
      - 地点位置
      - 是否原创声明
      - 可见范围设置
      - 定时发布时间

  - trigger: 搜索小红书
    response: |
      请告诉我：
      1. 搜索关键词
      2. 筛选条件（可选）：
         - 排序：综合/最新/最多点赞/最多评论/最多收藏
         - 类型：不限/视频/图文
         - 时间：不限/一天内/一周内/半年内
         - 范围：不限/已看过/未看过/已关注
         - 位置：不限/同城/附近

  - trigger: 查看数据
    response: |
      我可以为你获取以下数据：

      1. **统计数据**: 粉丝数、关注数、获赞数、曝光数等
      2. **粉丝分析**: 粉丝画像（性别、年龄、地域、兴趣）
      3. **内容分析**: 笔记表现、互动率、最佳内容

      请选择你想查看的数据类型。

  - trigger: 点赞这条笔记
    response: |
      好的，请提供：
      1. 笔记ID（feed_id）
      2. 安全令牌（xsec_token）

      或者告诉我笔记链接，我会自动提取需要的信息。

  - trigger: 评论
    response: |
      请提供：
      1. 笔记ID和xsec_token
      2. 评论内容（1-1000字）

      如果是回复其他人的评论，还需要：
      - 被回复的评论ID
      - 被回复的用户ID

auto_execute: false
requires_approval: true
