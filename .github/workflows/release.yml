name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Get version from tag
      id: version
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          VERSION="${GITHUB_REF#refs/tags/}"
        else
          TIMESTAMP=$(date +%Y.%m.%d.%H%M)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          VERSION="v${TIMESTAMP}-${COMMIT_SHA}"
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Version: ${VERSION}"

    - name: Build for multiple platforms
      run: |
        CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o xiaohongshu-mcp-darwin-arm64 .
        CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o xiaohongshu-mcp-darwin-amd64 .
        CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o xiaohongshu-mcp-windows-amd64.exe .
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags='-w -s -extldflags "-static"' -o xiaohongshu-mcp-linux-amd64 .

    - name: Package binaries
      run: |
        tar czf xiaohongshu-mcp-darwin-arm64.tar.gz xiaohongshu-mcp-darwin-arm64
        tar czf xiaohongshu-mcp-darwin-amd64.tar.gz xiaohongshu-mcp-darwin-amd64
        zip xiaohongshu-mcp-windows-amd64.zip xiaohongshu-mcp-windows-amd64.exe
        tar czf xiaohongshu-mcp-linux-amd64.tar.gz xiaohongshu-mcp-linux-amd64

    - name: Clean up old releases
      run: |
        RELEASES=$(gh release list --limit 100 | grep -E '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{4}-' | awk '{print $3}' | tail -n +11)
        for release in $RELEASES; do
          echo "Deleting old release: $release"
          gh release delete "$release" --yes --cleanup-tag
        done
      env:
        GH_TOKEN: ${{ github.token }}
      continue-on-error: true

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        draft: false
        prerelease: false
        files: |
          xiaohongshu-mcp-darwin-arm64.tar.gz
          xiaohongshu-mcp-darwin-amd64.tar.gz
          xiaohongshu-mcp-windows-amd64.zip
          xiaohongshu-mcp-linux-amd64.tar.gz
