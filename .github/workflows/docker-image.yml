name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Linux binary and Playwright installer
        run: |
          mkdir -p release
          find . -type f -name '*.go' -exec sed -i 's#github.com/playwright-community/playwright-go#github.com/mxschmitt/playwright-go#g' {} +
          go mod edit -droprequire=github.com/playwright-community/playwright-go
          go get github.com/mxschmitt/playwright-go@v0.6100.0
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags='-w -s -extldflags "-static"' -o release/xiaohongshu-mcp-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o release/playwright github.com/mxschmitt/playwright-go/cmd/playwright

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/sigu08162-alt/xiaohongshu-mcp:latest
            ghcr.io/sigu08162-alt/xiaohongshu-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
