services:
  xiaohongshu-mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: xiaohongshu-mcp
    restart: unless-stopped
    init: true
    tty: true
    volumes:
      - ./data:/app/data
      - ./images:/app/images
      - ../selectors_discovered_pages_fixed.yaml:/app/selectors_discovered_pages_fixed.yaml:ro
    environment:
      - COOKIES_PATH=/app/data/cookies.json
    ports:
      - "18060:18060"
