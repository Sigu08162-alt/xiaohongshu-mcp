# ============================================
# 超时配置 (单位: 秒)
# ============================================
timeouts:
  # 页面导航超时
  navigate: 300

  # 页面加载超时
  page_load: 30

  # 元素等待超时
  element_wait: 30

  # TAB查找超时
  tab_search: 15

  # 图片上传超时
  image_upload: 60

  # 发布结果等待
  publish_result: 30

  # API响应超时
  api_response: 30

# ============================================
# 轮询与等待配置 (单位: 毫秒)
# ============================================
polling:
  publish:
    timeout_ms: 60000
    interval_ms: 500
    max_retries: 3
    delays:
      page_stable_ms: 3000
      pre_submit_render_ms: 2000
      post_content_render_ms: 2000
      scroll_into_view_wait_ms: 500
      click_retry_wait_ms: 2000
      tag_editor_ready_ms: 1000
      tag_arrow_step_ms: 10
      tag_after_enter_ms: 1000
      tag_hash_delay_ms: 200
      tag_char_delay_ms: 50
      tag_after_text_ms: 1000
      tag_suggestion_click_ms: 200
      tag_after_tag_ms: 500
  draft:
    timeout_ms: 60000
    interval_ms: 500
    max_retries: 3
    delays:
      page_stable_ms: 3000
      post_content_render_ms: 2000
      scroll_into_view_wait_ms: 500
      click_retry_wait_ms: 2000
      tag_editor_ready_ms: 1000
      tag_arrow_step_ms: 10
      tag_after_enter_ms: 1000
      tag_hash_delay_ms: 200
      tag_char_delay_ms: 50
      tag_after_text_ms: 1000
      tag_suggestion_click_ms: 200
      tag_after_tag_ms: 500
  video:
    timeout_ms: 90000
    interval_ms: 1000
    max_retries: 3
    delays:
      wait_300000ms: 300000
      wait_3000ms: 3000
      wait_1000ms: 1000
      post_content_render_ms: 2000
      scroll_into_view_wait_ms: 500
      draft_save_wait_ms: 3000
  interaction:
    timeout_ms: 30000
    interval_ms: 500
    max_retries: 3
    delays:
      wait_600000ms: 600000
      wait_60000ms: 60000
      wait_300000ms: 300000
      wait_10000ms: 10000
      wait_800ms: 800
      wait_5000ms: 5000
      wait_3000ms: 3000
      wait_2000ms: 2000
      wait_1000ms: 1000
      wait_500ms: 500
      wait_300ms: 300
      wait_200ms: 200
      wait_100ms: 100
      human_delay_min_ms: 300
      human_delay_max_ms: 700
      reaction_time_min_ms: 300
      reaction_time_max_ms: 800
      hover_time_min_ms: 100
      hover_time_max_ms: 300
      read_time_min_ms: 500
      read_time_max_ms: 1200
      short_read_min_ms: 600
      short_read_max_ms: 1200
      scroll_wait_min_ms: 100
      scroll_wait_max_ms: 200
      post_scroll_min_ms: 300
      post_scroll_max_ms: 500
      scroll_slow_min_ms: 1200
      scroll_slow_max_ms: 1500
      scroll_normal_min_ms: 600
      scroll_normal_max_ms: 800
      scroll_fast_min_ms: 300
      scroll_fast_max_ms: 400
  analytics:
    timeout_ms: 30000
    interval_ms: 500
    max_retries: 3
    delays:
      wait_300000ms: 300000
      wait_60000ms: 60000
      wait_5000ms: 5000
      wait_2000ms: 2000
      wait_1000ms: 1000
      wait_500ms: 500
  auth:
    timeout_ms: 60000
    interval_ms: 500
    max_retries: 3
    delays:
      wait_2000ms: 2000
      wait_1000ms: 1000

# ============================================
# 间隔配置 (单位: 毫秒)
# ============================================
intervals:
  # 轮询检查间隔
  check: 500

  # TAB查找重试间隔
  tab_retry: 200

  # 标签输入延迟
  tag_input_char: 50
  tag_input_wait: 200
  tag_select_wait: 500

  # 内容输入延迟
  arrow_down: 10

# ============================================
# 限制配置
# ============================================
limits:
  # 标签数量限制
  max_tags: 10

  # 标题长度限制 (单位宽度)
  max_title_width: 40

  # 图片数量限制
  max_images: 9
  min_images: 1

  # 图片大小限制 (MB)
  max_image_size: 32

  # 视频大小限制 (GB)
  max_video_size: 20

# ============================================
# API 拦截配置
# ============================================
api:
  # 需要拦截的API路径模式
  intercept_patterns:
    - "*/web_api/sns/v2/note*"
    - "*/web_api/sns/v1/note*"
    - "*publish*"

  # 成功响应标识
  success_indicators:
    - field: "success"
      value: true
    - field: "code"
      value: 0

# ============================================
# 定时发布配置
# ============================================
schedule:
  # 最小提前时间 (小时)
  min_hours: 1

  # 最大提前时间 (天)
  max_days: 14

# ============================================
# 搜索配置
# ============================================
search:
  filters:
    # 排序选项
    sort_by:
      default: "综合"
      options:
        - "综合"
        - "最新"
        - "最多点赞"
        - "最多评论"
        - "最多收藏"

    # 笔记类型
    note_type:
      default: "不限"
      options:
        - "不限"
        - "视频"
        - "图文"

    # 发布时间
    publish_time:
      default: "不限"
      options:
        - "不限"
        - "一天内"
        - "一周内"
        - "半年内"

    # 搜索范围
    search_scope:
      default: "不限"
      options:
        - "不限"
        - "已看过"
        - "未看过"
        - "已关注"

    # 位置距离
    location:
      default: "不限"
      options:
        - "不限"
        - "同城"
        - "附近"

# ============================================
# 日志配置
# ============================================
logging:
  # 是否启用调试日志
  debug: false

  # 日志级别
  level: "info"

  # 是否记录选择器查找失败
  log_selector_failures: true

# ============================================
# 重试配置
# ============================================
retry:
  # 最大重试次数
  max_attempts: 3

  # 重试间隔 (秒)
  interval: 2

  # 是否启用指数退避
  exponential_backoff: true
